name: Azure VM deploy

on:
  push:
    branches:
      - "main"

env:
  IMAGE_NAME: boardingpass-be

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: GitHub 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Spring Boot JAR 빌드 (테스트 제외)
        run: ./gradlew clean bootJar -x test

      - name: 이미지 이름/태그 생성
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER_LC}/${REPO_LC}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker 이미지 빌드 및 푸시 (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Azure VM에 SSH 배포
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail

            IMAGE="${{ steps.meta.outputs.image }}"
            TAG="${{ steps.meta.outputs.tag }}"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            docker pull "${IMAGE}:${TAG}"

            docker rm -f boardingpass-be || true

            docker run -d \
              --name boardingpass-be \
              --restart unless-stopped \
              --add-host=host.docker.internal:host-gateway \
              -p 8080:8080 \
              --env-file /home/azureuser/.env \
              "${IMAGE}:${TAG}"

            docker image prune -f || true

      - name: Discord 알림
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "Discord webhook 미설정, 스킵"
            exit 0
          fi

          SHA="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF_NAME}"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          COMMIT_URL="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

          TITLE="🚀 배포 성공"
          COLOR=5763719
          if [ "${{ job.status }}" != "success" ]; then
            TITLE="❌ 배포 실패"
            COLOR=15548997
          fi

          curl -sS -H "Content-Type: application/json" -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"$TITLE\",
                \"color\": $COLOR,
                \"fields\": [
                  {\"name\": \"Repository\", \"value\": \"${GITHUB_REPOSITORY}\", \"inline\": false},
                  {\"name\": \"Branch\", \"value\": \"${BRANCH}\", \"inline\": false},
                  {\"name\": \"Image Tag\", \"value\": \"${SHA}\", \"inline\": false},
                  {\"name\": \"Actor\", \"value\": \"${GITHUB_ACTOR}\", \"inline\": false},
                  {\"name\": \"Commit\", \"value\": \"${COMMIT_URL}\", \"inline\": false},
                  {\"name\": \"Actions Run\", \"value\": \"${RUN_URL}\", \"inline\": false}
                ]
              }]
            }" \
            "$DISCORD_WEBHOOK_URL" || true